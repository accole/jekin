  <style>
    :root {
      /* Refined dark olive tone complementary to the invitation card's sage green */
      --bg-color: #232a1e;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.25),
                     0 12px 28px -4px rgba(0, 0, 0, 0.4),
                     0 24px 60px -12px rgba(0, 0, 0, 0.55);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg-color);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: max(1.5rem, env(safe-area-inset-top, 1.5rem))
               max(1rem, env(safe-area-inset-right, 1rem))
               max(1.5rem, env(safe-area-inset-bottom, 1.5rem))
               max(1rem, env(safe-area-inset-left, 1rem));
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      overflow-x: hidden;
    }

    .invite-card {
      display: block;
      margin: auto;
      width: auto;
      height: auto;
      max-width: min(100%, 650px);
      max-height: calc(100vh - 3rem);
      max-height: calc(100dvh - 3rem);
      object-fit: contain;
      border-radius: 6px;
      box-shadow: var(--card-shadow);
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
